name: 전체 매물·검색 상세페이지 자동 갱신

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 매물과 검색 상세페이지 갱신
        run: node scripts/sync-moldeon.mjs
      - name: 변경사항 공개 저장소 반영
        run: |
          if git diff --quiet; then
            echo "변경된 매물이 없습니다."
            exit 0
          fi
          git config user.name "dodreamcar-inventory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cars.json cars sitemap.xml
          git commit -m "매물 및 검색 상세페이지 자동 갱신"
          git push
